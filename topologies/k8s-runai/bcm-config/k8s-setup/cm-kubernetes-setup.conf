          common:
          - --wait
          - --create-namespace
          name: kube-prometheus-stack
          namespace: prometheus
          values:
            grafana:
              additionalDataSources: []
              extraObjects:
              - "apiVersion: grafana.integreatly.org/v1beta1\n\
                kind: Grafana\nmetadata:\n  name: {{ include \"\
                grafana.fullname\" . }}\n  namespace: {{ include\
                \ \"grafana.namespace\" . }}\n  labels:\n    {{-\
                \ include \"grafana.labels\" . | nindent 4 }}\n\
                spec:\n  external:\n    url: \"http://{{ include\
                \ \"grafana.fullname\" . }}.{{ include \"grafana.namespace\"\
                \ . }}.svc.cluster.local:{{ .Values.service.port\
                \ }}/\"\n    adminUser:\n      name: {{ (tpl .Values.admin.existingSecret\
                \ .) | default (include \"grafana.fullname\" .)\
                \ }}\n      key: {{ .Values.admin.userKey | default\
                \ \"admin-user\" }}\n    adminPassword:\n    \
                \  name: {{ (tpl .Values.admin.existingSecret\
                \ .) | default (include \"grafana.fullname\" .)\
                \ }}\n      key: {{ .Values.admin.passwordKey\
                \ | default \"admin-password\" }}\n"
              grafana.ini:
                server:
                  root_url: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
                  serve_from_sub_path: true
              persistence:
                enabled: true
                storageClassName: local-path
              sidecar:
                dashboards:
                  enabled: true
                  label: grafana_dashboard
                  labelValue: '1'
                  searchNamespace: ALL
            prometheus:
              prometheusSpec:
                additionalScrapeConfigs:
                - job_name: gpu-metrics
                  kubernetes_sd_configs:
                  - namespaces:
                      names:
                      - gpu-operator
                    role: endpoints
                  metrics_path: /metrics
                  relabel_configs:
                  - action: drop
                    regex: .*-node-feature-discovery-master
                    source_labels:
                    - __meta_kubernetes_endpoints_name
                  - action: replace
                    source_labels:
                    - __meta_kubernetes_pod_node_name
                    target_label: kubernetes_node
                  scheme: http
                  scrape_interval: 1s
            prometheus-node-exporter:
              prometheus:
                monitor:
                  attachMetadata:
                    node: true
                  relabelings:
                  - action: replace
                    sourceLabels:
                    - __meta_kubernetes_pod_node_name
                    targetLabel: kubernetes_node
          version: 79.5.0
        install_helm: true
        kind: regular
        repo:
          name: prometheus-community
          url: https://prometheus-community.github.io/helm-charts
