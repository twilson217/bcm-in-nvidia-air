# features.yaml - Controls what gets configured after BCM installation
# Each feature can be enabled/disabled independently.
# Config files are relative to this topology directory.

# BCM Interfaces - Configure BCM networking (no bonding)
bcm_networking:
  enabled: true
  config_file: bcm-config/networking.cmsh
  reboot_after: true

# BCM Switches - Add switches to BCM and configure ZTP
bcm_switches:
  enabled: true
  config_file:
    "10": bcm-config/switches_v10.cmsh     # Only BCM 10 tested so far.
    "11": bcm-config/switches_v11.cmsh   # Not yet supported by the deployment script.
  # switch_configs: Optional directory containing per-switch configuration files
  switch_configs_dir: bcm-config/switch-configs/
  # Preferred: explicit list of switch node names to reset (power-cycle) after ZTP is configured.
  # (Avoids unreliable auto-detection.)
  reboot_switches_after:
    - leaf-01

# BCM Nodes - Add compute nodes to BCM inventory
bcm_nodes:
  enabled: true
  config_file: bcm-config/nodes.cmsh
  # Dependency gate: only reset compute nodes after all management switches are UP in BCM.
  # (This prevents PXE/DHCP/boot flakiness when the fabric isn't ready yet.)
  wait_for_switches_up:
    - leaf-01
  wait_for_switches_timeout: 1800
  wait_for_switches_interval: 20
  # Preferred: explicit list of compute node names to reset after the above gate passes.
  reset_nodes_after:
    - cpu-01
    - cpu-02
    - user-k8s-01
    - admin-k8s-01
  installer_failed_monitoring: true

